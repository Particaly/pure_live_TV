name: build-android-Tv

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (leave empty to use the version in assets/version.json)'
        required: false
        default: ''
      ref:
        description: 'Branch or tag to build (leave empty to use the triggering ref)'
        required: false
        default: ''
      publish_release:
        description: '是否发布 GitHub Release（关闭则只产出构建产物；未配置签名 secrets 时不会发布）'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

# One release per tag: a second run for the same tag waits instead of racing
# the first one's APK upload against the same GitHub release.
concurrency:
  group: android-tv-release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    # Android only: nothing here needs the macOS toolchain, and a Linux runner
    # costs a tenth of a macOS minute and is usually faster for Gradle.
    runs-on: ubuntu-latest
    # A stuck Gradle daemon or a flaky download must not burn an hour of runner time.
    timeout-minutes: 60
    permissions:
      contents: write
    # Whether a Release was (or will be) published: the index-update job only
    # runs for real releases, not for artifact-only test builds.
    outputs:
      published: ${{ steps.signing.outputs.publish }}

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The tag is what the download paths are built from, so it is resolved before
      # anything is built: a tag push uses its own tag, and a manual run that typed
      # no tag falls back to assets/version.json instead of republishing the stale
      # default this workflow used to carry.
      - name: 解析发布标签
        id: meta
        run: |
          tag="${{ github.event.inputs.tag_name }}"
          if [ -z "$tag" ]; then
            case "${{ github.ref }}" in
              refs/tags/*) tag="${{ github.ref_name }}" ;;
              *) tag="v$(jq -r '.version' assets/version.json)" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布标签：$tag"

      # Forks do not inherit the upstream repo's Actions secrets, so a checkout
      # may have none at all. Gradle then falls back to debug signing (v1+v2,
      # installable on Android 6 boxes), but a debug-signed APK must never be
      # published as a Release — those builds stay on the run page only.
      - name: 检查签名配置
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish_release }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS，本次使用 debug 签名，只产出测试包，不发布 Release"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_INPUT" != "true" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 下载Android keystore
        if: steps.signing.outputs.mode == 'release'
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: key.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 创建key.properties
        if: steps.signing.outputs.mode == 'release'
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "17"
          cache: 'gradle'

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 更新Flutter的packages
        run: flutter pub get

      - name: 打包APK（Impeller 渲染器）
        run: flutter build apk --release --flavor impeller --split-per-abi --target-platform android-arm,android-arm64,android-x64 --android-skip-build-dependency-validation

      - name: 打包APK（Skia 渲染器）
        run: flutter build apk --release --flavor skia --split-per-abi --target-platform android-arm,android-arm64,android-x64 --android-skip-build-dependency-validation

      - name: 重命名 APK 文件
        run: |
          cd build/app/outputs/flutter-apk/
          count=0
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi=$(echo "$f" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64' | head -1)
            if echo "$f" | grep -q 'skia'; then renderer='skia'; else renderer='impeller'; fi
            mv "$f" "PureLive-TV-${abi}-${renderer}.apk"
            count=$((count + 1))
          done
          echo "==== 本次产物 ===="
          ls -lh PureLive-TV-*.apk
          # A build whose artifacts are not named as expected must fail here, not
          # publish a release with nothing in it.
          if [ "$count" -eq 0 ]; then
            echo "::error::没有找到 release APK，产物命名与预期不符"
            exit 1
          fi

      - name: 读取版本信息
        id: version
        run: |
          delim="EOF_${RANDOM}${RANDOM}"
          {
            echo "desc<<$delim"
            jq -r '.version_desc' assets/version.json
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Also on the run page: the release is the only place these APKs could be
      # downloaded from, so a failed release step left the build with nowhere to go.
      - name: 上传 APK 产物（运行页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-TV-${{ steps.meta.outputs.tag }}
          path: build/app/outputs/flutter-apk/PureLive-TV-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传至Release
        if: steps.signing.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            📦 纯粹直播 ${{ steps.meta.outputs.tag }}
            本次更新内容：
            ${{ steps.version.outputs.desc }}
            📺 版本说明：
            • Impeller 版：新渲染器，文件名带 -impeller，推荐优先尝试
            • Skia 版：旧渲染器，文件名带 -skia，画面异常/黑屏时改用此版
            • 每个渲染器均按 ABI 拆分：arm64-v8a（绝大多数设备）、armeabi-v7a（老设备）、x86_64（模拟器）

            本软件为开源项目,无广告，无病毒，若安装时出现病毒误报，可自行斟酌。
          prerelease: false
          files: build/app/outputs/flutter-apk/PureLive-TV-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every download path in one place on the run page: the six APK URLs, the
      # release page, and this run's artifacts.
      - name: 汇总下载路径
        env:
          PUBLISH: ${{ steps.signing.outputs.publish }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          {
            echo "## 📦 $tag 下载路径"
            echo ""
            for f in build/app/outputs/flutter-apk/PureLive-TV-*.apk; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              echo "- [$name]($base/$name) · $(du -h "$f" | cut -f1)"
            done
            echo ""
            if [ "$PUBLISH" = "true" ]; then
              echo "- Release 页面：https://github.com/${{ github.repository }}/releases/tag/$tag"
            else
              echo "- 本次为 debug 签名测试包，未发布 Release，请从下方运行页链接下载"
            fi
            echo "- 本次运行的构建产物：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 输出任务状态
        if: always()
        run: echo "🍏 Build status is ${{ job.status }}."

  # The app reads its download paths from assets/releases.json, and that index only
  # lists a release once it exists. This refreshes it after the APKs are published by
  # calling the manual index workflow instead of copying its steps, so the two cannot
  # drift apart.
  update-release-index:
    needs: build-android
    # Test builds without a published Release must not touch the index.
    if: needs.build-android.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build_release.yml
